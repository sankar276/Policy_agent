[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-agent"
version = "0.1.0"
description = "Unified policy validation and enforcement tool powered by OPA and Claude AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Policy Agent Team"}
]
keywords = ["policy", "validation", "opa", "ai", "devops", "gitops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "anthropic>=0.18.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "opa-python-client>=1.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
policy-agent = "policy_agent.cli.main:cli"

[project.urls]
Homepage = "https://github.com/policy-agent/policy-agent"
Documentation = "https://github.com/policy-agent/policy-agent/docs"
Repository = "https://github.com/policy-agent/policy-agent"

[tool.setuptools]
packages = ["policy_agent"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
